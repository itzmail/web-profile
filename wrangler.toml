name = "web-profile"
compatibility_date = "2026-04-15"

[vars]
PROFILE_VERSION = "v2"
OPENROUTER_MODEL = "nvidia/nemotron-3.5-lightning:free"
AI_MODEL = "clef-flash"
AI_MIN_CONFIDENCE = "0.5"

[[kv_namespaces]]
binding = "SESSION"
id = "d96c770cd5a8428b9298846c9cec1e84"

# Workers AI binding — powers the "Agent" decision router (@cf/cloudflare/clef-flash).
# No secret/API key required: the binding is provisioned automatically by the account.
[ai]
binding = "AI"
remote = true

# Per-IP rate limits (Workers Rate Limiting binding). Counted per Cloudflare
# location without KV writes, so they do not eat the 1,000 writes/day KV quota.
[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "AGENT_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 3
  period = 60
